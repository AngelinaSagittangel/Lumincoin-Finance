<h1 class="text-primary-emphasis mb-5">Создание категории доходов</h1>
<form class="mt-3" id="auth-form">
  <div class="input-group mb-3 w-75">
    <input type="text" class="form-control" id="new-category-input" />
    <div class="invalid-feedback">Заполните название категории</div>
  </div>
  <button
    id="auth-button"
    type="button"
    class="btn btn-success save-new-category"
  >
    Создать
  </button>

  <a href="/finance"
    ><button id="auth-button" type="button" class="btn btn-danger">
      Отмена
    </button></a
  >
</form>
