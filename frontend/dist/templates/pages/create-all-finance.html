<h1 class="text-primary-emphasis">Создание дохода/расхода</h1>
<form class="mt-3 d-flex flex-column gap-3" id="auth-form">
  <div class="input-group">
    <select id="typeInput" class="form-select rounded">
      <option value="" disabled selected>Выберите тип</option>
      <option value="Доход">Доход</option>
      <option value="Расход">Расход</option>
    </select>
    <div class="invalid-feedback">Выберите тип</div>
  </div>

  <div class="input-group">
    <select
      id="categoryInput"
      class="form-select rounded"
      aria-label="Default select example"
    >
      <option value="" disabled selected>Выберите категорию</option>
    </select>
    <div class="invalid-feedback">Выберите категорию</div>
  </div>

  <div class="input-group">
    <input
      id="amountInput"
      type="text"
      class="form-control rounded"
      placeholder="Сумма в $..."
    />
    <div class="invalid-feedback">Заполните сумму</div>
  </div>

  <div class="input-group">
    <div class="date-wrapper position-relative w-100">
      <input
        class="form-control  rounded datepicker-all-finance"
        type="date"
        id="datepicker-all-finance"
      />
      <span
        class="form-control rounded text-datepicker-all-finance"
        id="span-datepicker-all-finance"
        >Дата...</span
      >
    </div>
    <div class="invalid-feedback">Выберите дату</div>
  </div>

  <div class="input-group">
    <input
      id="commentInput"
      type="text"
      class="form-control rounded"
      placeholder="Комментарий..."
    />
  </div>

  <div class="wrapper-btn">
    <button id="auth-button" type="button" class="btn btn-success saveBtn">
      Создать
    </button>
    <a href="/allfinance"
      ><button id="auth-button" type="button" class="btn btn-danger">
        Отмена
      </button>
    </a>
  </div>
</form>
