
<div class="container">
  <div class="row justify-content-center align-items-center vh-100">
    <div class="col-md-6 col-lg-4">
      <div class="card-body">
        <div class="text-center mb-5">
          <a href="/" class="text-decoration-none">
            <img src="../../static/img/logo_auth.png" alt="logo" />
          </a>
        </div>

        <h1 class="text-primary-emphasis text-center">Создайте аккаунт</h1>
        <div id="common-error" class="invalid-feedback mb-3 text-center">
          Пользователь не создан
        </div>

        <form class="mt-3" id="registr-form">
          <div class="input-group mb-2 w-100">
            <span class="input-group-text" id="name-input"
              ><i class="bi bi-person"></i
            ></span>
            <input
              id="input-name"
              type="text"
              class="form-control rounded-end"
              placeholder="Имя"
              aria-label="Username"
              aria-describedby="name-input"
              required
            />
            <div class="invalid-feedback">Заполните имя</div>
          </div>

          <div class="input-group mb-2 w-100">
            <span class="input-group-text" id="lastName-input"
              ><i class="bi bi-person"></i
            ></span>
            <input
              id="input-lastName"
              type="text"
              class="form-control rounded-end"
              placeholder="Фамилия"
              aria-label="Username"
              aria-describedby="lastName-input"
            />
            <div class="invalid-feedback">Заполните фамилию</div>
          </div>

          <div class="input-group mb-2 w-100">
            <span class="input-group-text" id="mail-input"
              ><i class="bi bi-envelope-open"></i
            ></span>
            <input
              id="input-email"
              type="email"
              class="form-control rounded-end"
              placeholder="Электронная почта"
              aria-label="Username"
              aria-describedby="mail-input"
            />
            <div class="invalid-feedback">Заполните корректную почту</div>
          </div>

          <div class="input-group mb-2 w-100">
            <span class="input-group-text" id="password-input"
              ><i class="bi bi-lock"></i
            ></span>
            <input
              id="input-password"
              type="password"
              class="form-control rounded-end"
              placeholder="Пароль"
              aria-label="Username"
              aria-describedby="password-input"
            />
            <div class="invalid-feedback">Заполните корректный пароль</div>
          </div>
          <div class="input-group mb-2 w-100">
            <span class="input-group-text" id="password-input-repeat"
              ><i class="bi bi-lock"></i
            ></span>
            <input
              id="input-password-repeat"
              type="password"
              class="form-control rounded-end"
              placeholder="Подтверждение пароля"
              aria-label="Username"
              aria-describedby="password-input-repeat"
            />
            <div class="invalid-feedback">Пароль должен совпадать</div>
          </div>
          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="rememberMe" />
            <label class="form-check-label" for="rememberMe"
              >Запомнить меня</label
            >
          </div>

          <button
            id="registr-button"
            type="button"
            class="btn btn-primary w-100"
          >
            Войти
          </button>
        </form>

        <div class="mt-3 mb-4">
          <small
            >Уже есть аккаунт? <a href="/login">Войдите в систему</a></small
          >
        </div>
      </div>
    </div>
  </div>
</div>
