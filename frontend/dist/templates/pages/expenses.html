<h1 class="text-primary-emphasis">Расходы</h1>
<div class="row finance-wrapper">
  <div class="col-xl-4 col-lg-6 mb-4 card-add-wrapper">
    <div class="card card-add">
      <div class="card-body d-flex align-items-center justify-content-center">
        <a href="/expenses-create">
          <i class="bi bi-plus-lg"></i>
        </a>
      </div>
    </div>
  </div>
</div>

<div
  class="modal fade modal-finance"
  id="exampleModalCenter"
  tabindex="-1"
  aria-labelledby="exampleModalCenterTitle"
  style="display: none"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-2">
      <div class="modal-header">
        <h1
          class="modal-title fs-5 text-center modal-title"
          id="exampleModalCenterTitle"
        >
          Вы действительно хотите удалить категорию? Связанные доходы останутся
          без категории.
        </h1>
      </div>
      <div class="modal-footer d-flex justify-content-center">
        <button
          type="button"
          class="btn btn-success success-delete-button"
          data-bs-dismiss="modal"
        >
          Да, удалить
        </button>
        <button type="button" class="btn btn-danger close-delete-modal">
          Не удалять
        </button>
      </div>
    </div>
  </div>
</div>
