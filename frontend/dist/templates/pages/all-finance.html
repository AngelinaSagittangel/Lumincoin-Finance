<h1 class="text-primary-emphasis">Доходы и расходы</h1>
<div class="d-flex">
  <a href="#" class="btn btn-success me-2" id="btnCreateFinance"> Создать доход </a>
  <a href="#" class="btn btn-danger me-2" id="btnCreateExpense"> Создать расход </a>
</div>
<div class="tabs d-flex align-items-center gap-4 flex-wrap" id="btn-wrapper">
  <button
    id="todayBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Сегодня
  </button>
  <button
    id="weekBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Неделя
  </button>
  <button
    id="monthBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Месяц
  </button>
  <button
    id="yearBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Год
  </button>
  <button
    id="allDateBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Все
  </button>
  <button
    id="intervalBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Интервал
  </button>

  <div class="d-flex align-items-center justify-content-center gap-3">
    <div>с</div>
    <div class="date-wrapper position-relative">
      <input class="input-datepicker" type="date" id="datepicker"/>
      <span class="date-text" id="span-datepicker">Дата</span>
    </div>
    <div>по</div>
    <div class="date-wrapper position-relative">
      <input class="input-datepicker" type="date" id="datepicker2"/>
      <span class="date-text" id="span-datepicker2">Дата</span>
    </div>
  </div>
</div>

<div class="table-responsive" id="table-wrapper">
  <table class="table text-center w-100" id="table-finance">
    <thead>
      <tr>
        <th class="text-primary-emphasis" scope="col">№ операции</th>
        <th class="text-primary-emphasis" scope="col">Тип</th>
        <th class="text-primary-emphasis" scope="col">Категория</th>
        <th class="text-primary-emphasis" scope="col">Сумма</th>
        <th class="text-primary-emphasis" scope="col">Дата</th>
        <th class="text-primary-emphasis" scope="col">Комментарий</th>
        <th class="text-primary-emphasis" scope="col"></th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<div
  class="modal fade modal-finance"
  id="exampleModalCenter"
  tabindex="-1"
  aria-labelledby="exampleModalCenterTitle"
  style="display: none"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content p-2">
      <div class="modal-header">
        <h1
          class="modal-title fs-5 text-center modal-title"
          id="exampleModalCenterTitle"
        >
          Вы действительно хотите удалить категорию?
        </h1>
      </div>
      <div class="modal-footer d-flex justify-content-center">
        <button
          type="button"
          class="btn btn-success success-delete-button"
          data-bs-dismiss="modal"
        >
          Да, удалить
        </button>
        <button type="button" class="btn btn-danger close-delete-modal">
          Не удалять
        </button>
      </div>
    </div>
  </div>
</div>
