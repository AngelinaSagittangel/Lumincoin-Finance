<h1 class="text-primary-emphasis">Главная</h1>
<div class="tabs d-flex align-items-center gap-4 flex-wrap" id="btn-wrapper">
  <button
    id="todayBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Сегодня
  </button>
  <button
    id="weekBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Неделя
  </button>
  <button
    id="monthBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Месяц
  </button>
  <button
    id="yearBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Год
  </button>
  <button
    id="allDateBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Все
  </button>
  <button
    id="intervalBtn"
    type="button"
    class="btn btn-outline-secondary button-tabs"
  >
    Интервал
  </button>
  <div>с</div>
  <input
    class="input-datepicker"
    type="text"
    id="datepicker"
    placeholder="Дата"
  />
  <div>по</div>
  <input
    class="input-datepicker"
    type="text"
    id="datepicker2"
    placeholder="Дата"
  />
</div>
<div class="canvas-wrapper w-100 gap-4">
  <div class="canvas-container w-100">
    <h2 class="title-canvas">Доходы</h2>
    <canvas id="myChart"></canvas>
  </div>
  <div class="hr-element"></div>
  <div class="canvas-container w-100">
    <h2 class="title-canvas">Расходы</h2>
    <canvas id="myChart2"></canvas>
  </div>
</div>
