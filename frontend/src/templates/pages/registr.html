<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="../../../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="../../../node_modules/bootstrap-icons/font/bootstrap-icons.min.css"
    />
    <link
      rel="stylesheet"
      href="../../../node_modules/bootstrap-icons/font/bootstrap-icons.json"
    />
    <link rel="stylesheet" href="../../styles/auth.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-4">
          <div class="card-body">
            <div class="text-center mb-5">
              <a href="main.html" class="text-decoration-none">
                <picture>
                  <img src="../../static/img/logo_auth.png" alt="logo" />
                </picture>
              </a>
            </div>

            <h1 class="text-primary-emphasis text-center">Создайте аккаунт</h1>

            <form class="mt-3" id="registr-form">
              <div class="input-group mb-2">
                <span class="input-group-text" id="name-input"
                  ><i class="bi bi-person"></i
                ></span>
                <input
                  id="input-name"
                  type="text"
                  class="form-control"
                  placeholder="Имя"
                  aria-label="Username"
                  aria-describedby="name-input"
                  required
                />
                <div class="invalid-feedback">Заполните имя</div>
              </div>

              <div class="input-group mb-2">
                <span class="input-group-text" id="lastName-input"
                  ><i class="bi bi-person"></i
                ></span>
                <input
                  id="input-lastName"
                  type="text"
                  class="form-control"
                  placeholder="Фамилия"
                  aria-label="Username"
                  aria-describedby="lastName-input"
                />
                <div class="invalid-feedback">Заполните фамилию</div>
              </div>

              <div class="input-group mb-2">
                <span class="input-group-text" id="mail-input"
                  ><i class="bi bi-envelope-open"></i
                ></span>
                <input
                  id="input-email"
                  type="email"
                  class="form-control"
                  placeholder="Электронная почта"
                  aria-label="Username"
                  aria-describedby="mail-input"
                />
                <div class="invalid-feedback">Заполните корректную почту</div>
              </div>

              <div class="input-group mb-2">
                <span class="input-group-text" id="password-input"
                  ><i class="bi bi-lock"></i
                ></span>
                <input
                  id="input-password"
                  type="password"
                  class="form-control"
                  placeholder="Пароль"
                  aria-label="Username"
                  aria-describedby="password-input"
                />
                <div class="invalid-feedback">Заполните корректный пароль</div>
              </div>
              <div class="input-group mb-2">
                <span class="input-group-text" id="password-input-repeat"
                  ><i class="bi bi-lock"></i
                ></span>
                <input
                  id="input-password-repeat"
                  type="password"
                  class="form-control"
                  placeholder="Подтверждение пароля"
                  aria-label="Username"
                  aria-describedby="password-input-repeat"
                />
                <div class="invalid-feedback">Пароль должен совпадать</div>
              </div>
              <div class="form-check mb-4">
                <input
                  class="form-check-input"
                  type="checkbox"
                  id="rememberMe"
                />
                <label class="form-check-label" for="rememberMe"
                  >Запомнить меня</label
                >
              </div>

              <button id="registr-button" type="button" class="btn btn-primary w-100">Войти</button>
            </form>

            <div class="mt-3">
              <small
                >Уже есть аккаунт?
                <a href="auth.html">Войдите в систему</a></small
              >
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../../js/registr.js"></script>
  </body>
</html>
